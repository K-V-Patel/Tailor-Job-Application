version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: tailor_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - tailor-network

  redis:
    image: redis:7-alpine
    container_name: tailor_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tailor-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tailor_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/tailor-job-app?authSource=admin
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - tailor-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tailor_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - tailor-network
    command: npm run dev

volumes:
  mongodb_data:
  redis_data:

networks:
  tailor-network:
    driver: bridge
